# =====================================================================
#  hyprlock.conf – Gruvbox · nova-dark
# =====================================================================

general {
    disable_loading_bar    = true
    hide_cursor            = true
    grace                  = 0
    no_fade_in             = false
    no_fade_out            = false
}

# ── Background ────────────────────────────────────────────────────────
background {
    monitor    =
    path       = ~/wallpapers/yamaji.png
    blur_size  = 7
    blur_passes = 3
    brightness = 0.5
    contrast   = 0.9
    vibrancy   = 0.2
}

# ── Clock (time) ──────────────────────────────────────────────────────
label {
    monitor  =
    text     = cmd[update:1000] echo "<b>$(date +"%H:%M")</b>"
    color    = rgba(235, 219, 178, 1)   # @fg  #ebdbb2
    font_size   = 96
    font_family = JetBrains Mono Nerd Font Bold

    position = 0, 120
    halign   = center
    valign   = center
}

# ── Date ──────────────────────────────────────────────────────────────
label {
    monitor  =
    text     = cmd[update:60000] echo "$(date +"%A, %d %B %Y")"
    color    = rgba(168, 153, 132, 1)   # @grey0  #a89984
    font_size   = 22
    font_family = JetBrains Mono Nerd Font

    position = 0, 30
    halign   = center
    valign   = center
}

# ── Password input ────────────────────────────────────────────────────
input-field {
    monitor  =
    size     = 300, 52

    # colors
    outer_color       = rgba(152, 151, 26, 0.7)    # @green
    inner_color       = rgba(40, 40, 40, 0.85)     # @bg1
    font_color        = rgba(235, 219, 178, 1)     # @fg
    check_color       = rgba(152, 151, 26, 1)      # @green
    fail_color        = rgba(204, 36, 29, 1)       # @red
    capslock_color    = rgba(215, 153, 33, 1)      # @yellow

    # text
    placeholder_text  = <span foreground="##a89984"> 󰌾  Enter Password</span>
    fail_text         = <span foreground="##cc241d">󰌾  Wrong password</span>
    hide_input        = false
    dots_size         = 0.28
    dots_spacing      = 0.18
    dots_center       = true

    # style
    rounding          = 12
    outline_thickness = 2
    shadow_passes     = 2
    shadow_size       = 4
    shadow_color      = rgba(0, 0, 0, 0.5)

    position = 0, -80
    halign   = center
    valign   = center

    fade_on_empty    = true
    fade_timeout     = 1000
}

# ── Greeting label ────────────────────────────────────────────────────
label {
    monitor  =
    text     = cmd[update:0] echo "󰀄  $(whoami)"
    color    = rgba(152, 151, 26, 0.8)   # @green
    font_size   = 16
    font_family = JetBrains Mono Nerd Font

    position = 0, -140
    halign   = center
    valign   = center
}
