# ~/.config/hypr/hypridle.conf
# Sleek little sleep-orb for Hyprland 🌙

general {
    # Lock command
    lock_cmd = pidof hyprlock || hyprlock

    # Lock before suspend
    before_sleep_cmd = loginctl lock-session

    # Turn displays back on after wake
    after_sleep_cmd = hyprctl dispatch dpms on

    # Ignore dbus inhibit requests? (false recommended)
    ignore_dbus_inhibit = false
}

# ----------------------------------------
# LOCK SCREEN
# ----------------------------------------
listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

# ----------------------------------------
# SCREEN OFF
# ----------------------------------------
listener {
    timeout = 600
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}

# ----------------------------------------
# SUSPEND SYSTEM
# ----------------------------------------
listener {
    timeout = 1800
    on-timeout = systemctl suspend
}

# ----------------------------------------
# OPTIONAL:
# DIM SCREEN BEFORE OFF
# Requires brightnessctl
# sudo pacman -S brightnessctl
# ----------------------------------------
listener {
    timeout = 540
    on-timeout = brightnessctl set 20%
    on-resume = brightnessctl set 100%
}

# ----------------------------------------
# OPTIONAL:
# PAUSE MUSIC ON LOCK
# Uncomment if using playerctl
# sudo pacman -S playerctl
# ----------------------------------------

